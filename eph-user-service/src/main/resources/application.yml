server:
  port: 8081

spring:
  application:
    name: eph-user-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/eph_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: eph_user
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

eph:
  jwt:
    secret: ${EPH_JWT_SECRET:eph-dev-secret-key-change-me-please-0123456789abcdef}
  master-key: ${EPH_MASTER_KEY:eph-dev-master-key-0123456789abcdef}
  ca:
    key-dir: ${EPH_KEY_DIR:./eph-keys/ca}
  internal:
    secret: ${EPH_INTERNAL_SECRET:eph-internal-dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
